services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - app-net

volumes:
  redis-data:

networks:
  app-net:
    driver: bridge
